# Build gate: style, lint, tests and builds for both apps. Required to merge into main.
# Run the same checks locally with `just ci`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Style (ktlint)
        run: ./gradlew ktlintCheck

      - name: Lint (Android Lint, warnings fail)
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  mac:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint version

      - name: Style and lint (SwiftLint, strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Generate project
        run: xcodegen

      - name: Build and test (warnings fail)
        run: |
          xcodebuild -project Volley.xcodeproj -scheme Volley -configuration Debug \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-results
          path: mac/build/TestResults.xcresult
          if-no-files-found: ignore
