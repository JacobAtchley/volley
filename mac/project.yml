# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Volley
options:
  bundleIdPrefix: app.volley
  deploymentTarget:
    macOS: "14.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
targets:
  Volley:
    type: application
    platform: macOS
    sources: [Volley]
    dependencies:
      - package: GRDB
    info:
      path: Volley/Info.plist
      properties:
        CFBundleDisplayName: Volley
        LSUIElement: true
        NSLocalNetworkUsageDescription: Volley finds and talks to your phone on your local network.
        NSBonjourServices: [_volley._tcp]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.volley.phone-path
            UTTypeDescription: Volley phone file
            UTTypeConformsTo: [public.data]
    # Not sandboxed: the Files pane browses any Mac folder (user's choice). SandboxMigration moves old data.
    entitlements:
      path: Volley/Volley.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.volley.mac
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  VolleyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [VolleyTests]
    dependencies:
      - target: Volley
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
schemes:
  Volley:
    build:
      targets:
        Volley: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [VolleyTests]
