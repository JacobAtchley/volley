# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Volley
options:
  bundleIdPrefix: app.volley
  deploymentTarget:
    macOS: "14.0"
targets:
  Volley:
    type: application
    platform: macOS
    sources: [Volley]
    info:
      path: Volley/Info.plist
      properties:
        CFBundleDisplayName: Volley
        LSUIElement: true
        NSLocalNetworkUsageDescription: Volley finds and talks to your phone on your local network.
        NSBonjourServices: [_volley._tcp]
    entitlements:
      path: Volley/Volley.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.volley.mac
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
